<!DOCTYPE html>
<html>
<!--
//  功能描述(Description)：{PAGE_TITLE}
//  作者(Author)：AI Assistant
//  日期(Create Time)：{CREATE_DATE}
//  参考代码：03-PDA/LonSon.Mobile.PrinxChengShan.App/Forming/BarcodeUpdate.html
-->
<head>
    <meta charset="utf-8">
    <title>{PAGE_TITLE}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1,user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="stylesheet" href="../css/mui.min.css" />
    <link rel="stylesheet" type="text/css" href="../css/mui.picker.min.css" />
    <link rel="stylesheet" href="../css/comStyle.css" />
</head>

<body>
    <!-- 顶部导航栏 -->
    <header class="mui-bar mui-bar-nav">
        <a class="mui-action-back mui-icon mui-icon-left-nav mui-pull-left"></a>
        <h1 class="mui-title"><label id="lblTitle">{PAGE_TITLE}</label></h1>
    </header>

    <!-- 页面内容区 -->
    <div class="mui-content">
        <div class="mui-content-padded">
            <div class="mui-input-group">
                <!-- 扫码输入框 -->
                <div class="mui-input-row">
                    <input type="text" id="selBARCODE" placeholder="扫描条码... " />
                </div>
                <!-- 只读属性展示 -->
                <div class="mui-input-row">
                    <label id="lblBARCODE">条码:</label>
                    <input type="text" id="txtBARCODE" class="mui-input" readonly="readonly" style="font-weight:bold;"/>
                </div>
                <div class="mui-input-row">
                    <label id="lblITNBR">规格代码:</label>
                    <input type="text" id="txtITNBR" class="mui-input" readonly="readonly" style="font-weight:bold;"/>
                </div>
                <div class="mui-input-row">
                    <label id="lblITDSC">规格名称:</label>
                    <input type="text" id="txtITDSC" class="mui-input" readonly="readonly" style="font-weight:bold;"/>
                </div>
                <div class="mui-input-row">
                    <label id="lblQTY">数量:</label>
                    <input type="text" id="txtQTY" class="mui-input" />
                </div>
            </div>
            <br/>
            <!-- 操作按钮 -->
            <div style="text-align: center;">
                <button type="button" class="mui-btn mui-btn-danger mui-action-back"><label id="lblBack">返回</label></button>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <button id="btnAdd" type="button" class="mui-btn mui-btn-primary"><label id="lblOK">确定</label></button>
            </div>
            <br/><br/><br/>
        </div>

        <!-- 底部登录人与工厂状态栏 -->
        <nav class="mui-bar mui-bar-tab">
            <a class="mui-tab-item">
                <label id="lblUs">用户:</label><span id="lblUser"></span>
            </a>
            <a class="mui-tab-item">
                <span id="lblTime"></span>
            </a>
        </nav>
    </div>
</body>
<script src="../js/jquery-3.3.1.min.js"></script>
<script src="../js/mui.min.js"></script>
<script src="../js/mui.picker.min.js"></script>
<script src="../js/utilComm.js"></script>
<script src="../js/Language.js"></script>
<script src="../js/Lang.js"></script>
<script src="../js/{SCRIPT_NAME}.js"></script>
</html>
